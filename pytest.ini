[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results

markers =
    smoke: critical-path smoke tests (run on every commit)
    regression: full regression suite (nightly)
    api: API/service-layer tests against /stratus dispatcher
    ui: browser-driven tests via Playwright
    db: database-layer tests (Hibernate entity / SQL verification)
    bdd: BDD scenarios via pytest-bdd
    demo: end-to-end demo tests (Customer module)
    consignment: STRAT-30194 Buy/Trade/Consignment intake flows
    pos: point-of-sale tender + receipt flows

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
